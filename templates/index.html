<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agentic RAG Supervisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
    }
    .header {
      padding: 16px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .status-badge {
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #ca8a04;
      color: #000;
      font-weight: 600;
    }
    .status-ready {
      background: #16a34a;
      color: #fff;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .bubble.user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
    }
    .bubble.bot {
      align-self: flex-start;
      background-color: #1e293b;
      border: 1px solid #334155;
    }
    .trace {
      margin-top: 8px;
      padding: 8px 12px;
      background: #090d16;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .input-row {
      padding: 16px 20px;
      background: #1e293b;
      display: flex;
      gap: 10px;
      border-top: 1px solid #334155;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    input[type="text"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div>
        <strong>Agentic RAG Supervisor</strong>
        <span style="color: #64748b; font-size: 0.9rem;">(user: bingbling)</span>
      </div>
      <div id="status" class="status-badge">Warming up...</div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Waiting for models to warm up..." disabled />
      <button id="sendBtn" disabled onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const messagesEl = document.getElementById("messages");

    async function checkStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        if (data.ready) {
          statusEl.innerText = "System Ready";
          statusEl.classList.add("status-ready");
          inputEl.disabled = false;
          sendBtn.disabled = false;
          inputEl.placeholder = "Ask your question...";
        } else {
          statusEl.innerText = data.step;
          setTimeout(checkStatus, 1500);
        }
      } catch (e) {
        statusEl.innerText = "Error connecting";
        setTimeout(checkStatus, 3000);
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;

      appendBubble(text, "user");
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: "bingbling", message: text })
        });
        const data = await res.json();
        if (data.error) {
          appendBubble("Error: " + data.error, "bot");
        } else {
          appendBubble(data.reply, "bot", data.trace, data.status);
        }
      } catch (err) {
        appendBubble("Request failed: " + err.message, "bot");
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    function appendBubble(content, role, trace = [], status = "") {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;
      bubble.textContent = content;

      if (trace && trace.length > 0) {
        const traceEl = document.createElement("div");
        traceEl.className = "trace";
        traceEl.textContent = `[${status}]\n` + trace.join("\n");
        bubble.appendChild(traceEl);
      }

      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    inputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !inputEl.disabled) sendMessage();
    });

    checkStatus();
  </script>
</body>
</html>
