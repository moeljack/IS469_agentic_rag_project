<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agentic RAG Supervisor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Markdown rendering for the bot's replies. Loaded by the browser (your laptop), not by the cluster node.
       If these fail to load, replies fall back to plain text. -->
  <script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      justify-content: center;
      height: 100vh;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      border-left: 1px solid #1e293b;
      border-right: 1px solid #1e293b;
    }
    .header {
      padding: 16px 20px;
      background: #1e293b;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .user-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .user-controls label {
      color: #94a3b8;
      font-size: 0.9rem;
    }
    select {
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 0.9rem;
    }
    .small-btn {
      padding: 6px 10px;
      font-size: 0.85rem;
      background: #334155;
      font-weight: 600;
    }
    .profile {
      padding: 8px 20px;
      background: #111827;
      border-bottom: 1px solid #334155;
      font-size: 0.85rem;
      color: #94a3b8;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
    }
    .profile b { color: #e2e8f0; font-weight: 600; }
    .profile .empty { font-style: italic; }
    .status-badge {
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      background: #ca8a04;
      color: #000;
      font-weight: 600;
    }
    .status-ready {
      background: #16a34a;
      color: #fff;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }
    .bubble.user {
      align-self: flex-end;
      background-color: #2563eb;
      color: #fff;
      white-space: pre-wrap;
    }
    .bubble.bot {
      align-self: flex-start;
      background-color: #1e293b;
      border: 1px solid #334155;
    }
    .bubble.system {
      align-self: center;
      background: transparent;
      color: #64748b;
      font-size: 0.85rem;
      padding: 4px 8px;
    }
    .plain { white-space: pre-wrap; }           /* user text, errors, and the fallback when Markdown can't load */

    /* --- Markdown inside bot replies --- */
    .md > :first-child { margin-top: 0; }
    .md > :last-child { margin-bottom: 0; }
    .md p { margin: 0 0 0.75em; }
    .md h1, .md h2, .md h3, .md h4 { margin: 1em 0 0.5em; line-height: 1.3; }
    .md h1 { font-size: 1.25rem; }
    .md h2 { font-size: 1.15rem; }
    .md h3, .md h4 { font-size: 1.05rem; }
    .md ul, .md ol { margin: 0 0 0.75em; padding-left: 1.4em; }
    .md li { margin: 0.2em 0; }
    .md li > ul, .md li > ol { margin: 0.2em 0 0; }
    .md strong { color: #fff; }
    .md a { color: #93c5fd; word-break: break-all; }
    .md code {
      background: #0f172a;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.9em;
    }
    .md pre {
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 6px;
      overflow-x: auto;
    }
    .md pre code { padding: 0; background: none; }
    .md blockquote {
      margin: 0 0 0.75em;
      padding: 2px 12px;
      border-left: 3px solid #475569;
      color: #cbd5e1;
    }
    .md table {
      border-collapse: collapse;
      margin: 0 0 0.75em;
      font-size: 0.9rem;
      display: block;
      overflow-x: auto;
    }
    .md th, .md td { border: 1px solid #334155; padding: 6px 10px; text-align: left; }
    .md th { background: #0f172a; }
    .md hr { border: none; border-top: 1px solid #334155; margin: 1em 0; }

    /* --- Agent trace: collapsed by default --- */
    .trace {
      margin-top: 10px;
      background: #090d16;
      border-radius: 4px;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .trace summary {
      cursor: pointer;
      padding: 6px 12px;
      user-select: none;
      list-style: none;
    }
    .trace summary::-webkit-details-marker { display: none; }
    .trace summary::before { content: "▸ "; }
    .trace[open] summary::before { content: "▾ "; }
    .trace summary:hover { color: #e2e8f0; }
    .trace pre {
      margin: 0;
      padding: 4px 12px 10px;
      font-family: ui-monospace, Menlo, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .input-row {
      padding: 16px 20px;
      background: #1e293b;
      display: flex;
      gap: 10px;
      border-top: 1px solid #334155;
    }
    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    input[type="text"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    button {
      padding: 12px 20px;
      border-radius: 6px;
      border: none;
      background: #2563eb;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled, select:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="header">
      <div class="user-controls">
        <strong>Agentic RAG Supervisor</strong>
        <label for="userSelect">User:</label>
        <select id="userSelect"></select>
        <button class="small-btn" id="addUserBtn" type="button">+ Add</button>
        <button class="small-btn" id="clearBtn" type="button">Clear chat</button>
      </div>
      <div id="status" class="status-badge">Warming up...</div>
    </div>

    <div class="profile" id="profile"><span class="empty">Loading users…</span></div>

    <div class="messages" id="messages"></div>

    <div class="input-row">
      <input type="text" id="userInput" placeholder="Waiting for models to warm up..." disabled />
      <button id="sendBtn" disabled onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    const DEFAULT_USER = "{{ default_user }}";
    const USER_ID_RE = /^[A-Za-z0-9_.\-]{1,64}$/;

    const statusEl = document.getElementById("status");
    const inputEl = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const messagesEl = document.getElementById("messages");
    const userSelect = document.getElementById("userSelect");
    const addUserBtn = document.getElementById("addUserBtn");
    const clearBtn = document.getElementById("clearBtn");

    // Per-user chat transcripts, kept in the page: { user_id: [ {content, role, trace, status} ] }
    const histories = {};
    // Profiles from the user store: { user_id: {user_id, company, facts, created_at} }
    const profiles = {};
    let currentUser = loadPref("currentUser") || DEFAULT_USER;
    let ready = false;
    let busy = false;

    const profileEl = document.getElementById("profile");

    // --- localStorage helpers (only the last selected user is remembered; safe if storage is blocked) ---
    function loadPref(key) {
      try { return localStorage.getItem(key); } catch (e) { return null; }
    }
    function savePref(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

    // --- users from the user store ---
    async function loadUsers() {
      try {
        const res = await fetch("/users");
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        for (const p of data.users) profiles[p.user_id] = p;
      } catch (e) {
        profileEl.innerHTML = `<span class="empty">Could not load users: ${escapeHtml(e.message)}</span>`;
      }
      const ids = Object.keys(profiles);
      // Saved choice no longer in the store → fall back to the default, then the first stored user
      if (!profiles[currentUser]) {
        currentUser = profiles[DEFAULT_USER] ? DEFAULT_USER : (ids[0] || DEFAULT_USER);
      }
      renderUserOptions();
      renderProfile();
    }

    function optionLabel(p) {
      const name = p.company && p.company.company_name;
      return name ? `${p.user_id} — ${name}` : p.user_id;
    }

    function renderUserOptions() {
      userSelect.innerHTML = "";
      const ids = Object.keys(profiles);
      if (!ids.includes(currentUser)) ids.push(currentUser); // new user, no profile until first message
      for (const id of ids) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = profiles[id] ? optionLabel(profiles[id]) : `${id} (new)`;
        userSelect.appendChild(opt);
      }
      userSelect.value = currentUser;
    }

    const FACT_LABELS = {
      fye: "Financial year end",
      is_new_company: "New company",
      incorporation_year: "Incorporated",
      tax_resident: "Tax resident",
    };

    function renderProfile() {
      const p = profiles[currentUser];
      if (!p) {
        profileEl.innerHTML = `<span class="empty">No saved profile for ${escapeHtml(currentUser)} yet — one is created with the first question.</span>`;
        return;
      }
      const parts = [];
      const c = p.company || {};
      if (c.company_name) parts.push(`Company: <b>${escapeHtml(c.company_name)}</b>`);
      if (c.uen) parts.push(`UEN: <b>${escapeHtml(c.uen)}</b>`);
      for (const [k, v] of Object.entries(p.facts || {})) {
        if (v === null || v === undefined || v === "") continue;
        const shown = typeof v === "boolean" ? (v ? "Yes" : "No") : String(v);
        parts.push(`${escapeHtml(FACT_LABELS[k] || k)}: <b>${escapeHtml(shown)}</b>`);
      }
      profileEl.innerHTML = parts.length
        ? parts.map(x => `<span>${x}</span>`).join("")
        : `<span class="empty">No facts remembered for ${escapeHtml(currentUser)} yet.</span>`;
    }

    // Re-read one profile after an answer, so newly learned facts appear
    async function refreshProfile(user) {
      try {
        const res = await fetch(`/users/${encodeURIComponent(user)}`);
        if (!res.ok) return;
        const data = await res.json();
        const isNew = !profiles[user];
        profiles[user] = data.user;
        if (isNew) renderUserOptions(); else {
          const opt = Array.from(userSelect.options).find(o => o.value === user);
          if (opt) opt.textContent = optionLabel(data.user);
        }
        if (user === currentUser) renderProfile();
      } catch (e) {}
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, ch => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]
      ));
    }

    // --- Markdown for bot replies ---
    const MARKDOWN_OK = typeof marked !== "undefined" && typeof DOMPurify !== "undefined";
    if (MARKDOWN_OK) {
      marked.setOptions({ gfm: true, breaks: true });   // gfm: tables + bare-URL links; breaks: single newlines kept
      // Links open in a new tab, without giving that tab access to this page
      DOMPurify.addHook("afterSanitizeAttributes", node => {
        if (node.tagName === "A") {
          node.setAttribute("target", "_blank");
          node.setAttribute("rel", "noopener noreferrer");
        }
      });
    }

    // The supervisor cites retrieved chunks as [Doc 3] or [Doc 1, Doc 6]. Users can't open those chunks (the
    // Sources list has the real links), so the markers are hidden here. The answer itself keeps them, so the
    // terminal harness and the evals still see the citations.
    const DOC_CITATION_RE = /[ \t]*\[\s*Doc\s*\d+(?:\s*[,;]\s*(?:Doc\s*)?\d+)*\s*\]/gi;
    function stripDocCitations(text) {
      return String(text).replace(DOC_CITATION_RE, "");
    }

    // Returns sanitized HTML for a reply, or null when the Markdown libraries didn't load
    function renderMarkdown(text) {
      if (!MARKDOWN_OK) return null;
      return DOMPurify.sanitize(marked.parse(stripDocCitations(text)));
    }

    // One-line label for the collapsed trace, e.g. "Agent trace · answered · 43.2s"
    function traceSummary(trace, status) {
      const timing = trace.map(l => /total\s+([\d.]+\s*s)\b/.exec(l)).find(Boolean);
      return ["Agent trace", status, timing && timing[1]].filter(Boolean).join(" · ");
    }

    function switchUser(user) {
      currentUser = user;
      savePref("currentUser", user);
      userSelect.value = user;
      renderProfile();
      renderHistory();
      if (ready) inputEl.focus();
    }

    userSelect.addEventListener("change", () => switchUser(userSelect.value));

    addUserBtn.addEventListener("click", async () => {
      const name = (prompt("New user id (letters, numbers, _ . -):") || "").trim();
      if (!name) return;
      if (!USER_ID_RE.test(name)) {
        alert("Invalid user id. Use letters, numbers, underscore, dot or dash (max 64).");
        return;
      }
      try {
        const res = await fetch("/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: name })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.statusText);
        profiles[data.user.user_id] = data.user;
        currentUser = data.user.user_id;
        renderUserOptions();
        switchUser(currentUser);
      } catch (e) {
        alert("Could not create user: " + e.message);
      }
    });

    clearBtn.addEventListener("click", async () => {
      histories[currentUser] = [];
      renderHistory();
      try {
        await fetch("/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user: currentUser })
        });
      } catch (e) {}
    });

    // --- status polling ---
    async function checkStatus() {
      try {
        const res = await fetch("/status");
        const data = await res.json();
        if (data.ready) {
          ready = true;
          statusEl.innerText = "System Ready";
          statusEl.classList.add("status-ready");
          inputEl.placeholder = "Ask your question...";
          setBusy(false);
          loadUsers().then(renderHistory);
        } else {
          statusEl.innerText = data.step;
          setTimeout(checkStatus, 1500);
        }
      } catch (e) {
        statusEl.innerText = "Error connecting";
        setTimeout(checkStatus, 3000);
      }
    }

    function setBusy(isBusy) {
      busy = isBusy;
      const disabled = isBusy || !ready;
      inputEl.disabled = disabled;
      sendBtn.disabled = disabled;
      // Prevent switching user while a request is in flight
      userSelect.disabled = isBusy;
      addUserBtn.disabled = isBusy;
      clearBtn.disabled = isBusy;
    }

    // --- chat ---
    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      const user = currentUser; // lock the user for this request
      addToHistory(user, { content: text, role: "user" });
      inputEl.value = "";
      setBusy(true);

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user, message: text })
        });
        const data = await res.json();
        if (data.error) {
          addToHistory(user, { content: "Error: " + data.error, role: "bot", plain: true });
        } else {
          addToHistory(user, { content: data.reply, role: "bot", trace: data.trace, status: data.status });
          refreshProfile(user);
        }
      } catch (err) {
        addToHistory(user, { content: "Request failed: " + err.message, role: "bot", plain: true });
      } finally {
        setBusy(false);
        inputEl.focus();
      }
    }

    function addToHistory(user, entry) {
      (histories[user] = histories[user] || []).push(entry);
      if (user === currentUser) appendBubble(entry);
    }

    function renderHistory() {
      messagesEl.innerHTML = "";
      appendBubble({ content: `Chatting as ${currentUser}`, role: "system" });
      for (const entry of histories[currentUser] || []) appendBubble(entry);
    }

    function appendBubble({ content, role, trace = [], status = "", plain = false }) {
      const bubble = document.createElement("div");
      bubble.className = `bubble ${role}`;

      // Bot replies are Markdown; everything else (and any fallback) is plain text
      const body = document.createElement("div");
      const html = (role === "bot" && !plain) ? renderMarkdown(content) : null;
      if (html !== null) {
        body.className = "md";
        body.innerHTML = html;
      } else {
        body.className = "plain";
        body.textContent = (role === "bot" && !plain) ? stripDocCitations(content) : content;
      }
      bubble.appendChild(body);

      if (trace && trace.length > 0) {
        const details = document.createElement("details");   // collapsed until clicked
        details.className = "trace";
        const summary = document.createElement("summary");
        summary.textContent = traceSummary(trace, status);
        const pre = document.createElement("pre");
        pre.textContent = trace.join("\n");
        details.append(summary, pre);
        bubble.appendChild(details);
      }

      messagesEl.appendChild(bubble);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    inputEl.addEventListener("keypress", (e) => {
      if (e.key === "Enter" && !inputEl.disabled) sendMessage();
    });

    renderHistory();
    checkStatus();
  </script>
</body>
</html>
