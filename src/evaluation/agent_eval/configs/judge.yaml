# The judge for agent_eval's LLM-graded scores (task success: faithfulness and answer relevance).
# Copied from rag_eval/rag_eval_approach/configs/judge.yaml. Use the same judge as rag_eval if the two reports are
# compared, a strong model that is not one of the compared generators, and do not change it between runs.
#
# provider: google | anthropic | openai | ollama (local; no key needed, OLLAMA_HOST is used if set)
# ollama options (all optional): num_ctx (default 8192; keep the job script's warm-up value the same), num_predict
# (cap on output tokens), reasoning (default false), keep_alive (default 60m). google/openai: {temperature: 0};
# anthropic: none (temperature rejected).
provider: ollama
model: gemma4:12b          # not a Qwen model, so it is not one of the compared generators
options: {}