# Stage 3: naive RAG with an API generator (pip install openai; OPENAI_API_KEY).
run_id: g_naive_openai
system: naive
retriever:
  mode: hybrid_rerank
  k: 5
  candidates: 10
generator:
  provider: groq       # or groq (OpenAI-compatible endpoint, key GROQ_API_KEY) with model: openai/gpt-oss-120b
  model: openai/gpt-oss-120b
  options:
    temperature: 0         # set to null if the model rejects temperature
today: "2026-11-03"
